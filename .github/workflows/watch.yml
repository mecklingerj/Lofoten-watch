# Ablage im Repo unter: .github/workflows/watch.yml
name: Norrona Lofoten Watch

on:
  schedule:
    - cron: "17 * * * *"   # stündlich zur Minute 17 (UTC)
  workflow_dispatch: {}     # manuell auslösbar zum Testen

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install playwright requests

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Commit state
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen.json"
          git push
