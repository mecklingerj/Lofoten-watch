name: Norrona Lofoten Watch

on:
  schedule:
    - cron: "17 * * * *"   # stündlich zur Minute 17 (UTC)
  workflow_dispatch: {}     # manuell auslösbar zum Testen

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add xl_state.json || exit 0
          git diff --cached --quiet || git commit -m "update xl_state.json"
          git push
